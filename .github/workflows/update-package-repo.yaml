# $schema: https://json.schemastore.org/github-workflow.json
name: Update Package Repo

on:
  workflow_call:
    inputs:
      signing-key-name:
        description: "The name of the key used to sign the package index (not including the .rsa/.rsa.pub suffix)"
        required: false
        type: string
        default: ""
      environment:
        description: The environment to use when deploying to GitHub Pages
        type: string
        default: "package-repo"
    secrets:
      signing-key:
        description: "The private key used to sign the package index (PEM format)"
        required: false

permissions: {}

jobs:
  build:
    name: Build package repo

    runs-on: ubuntu-24.04

    permissions:
      contents: read  # to get packages from Releases

    steps:
      - name: Setup melange
        uses: rbrownwsws/setup-melange@7bbe6a2ac345248521d13c5d0ab1c0c821839ce8 # master

      - name: Create package repo
        id: create-repo
        uses: rbrownwsws/create-melange-package-repo@65adbdabfe2bc330a7c7f8c99daf6b26b297c261 # master
        with:
          signing-key: ${{ secrets.signing-key }}
          signing-key-name: ${{ inputs.signing-key-name }}

      - name: Create package repo index pages
        uses: rbrownwsws/create-melange-package-repo-index-pages@8f277f533d3353def5592e73efb54fbc9655a84e # master
        with:
          repo-dir: ${{ steps.create-repo.outputs.repo-dir }}

      - name: Upload package repo as artifact
        id: deployment
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.create-repo.outputs.repo-dir }}

  deploy:
    name: Deploy package repo to GitHub Pages

    needs: build

    runs-on: ubuntu-24.04

    permissions:
      pages: write     # to deploy to Pages
      id-token: write  # to verify the deployment originates from an appropriate source

    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
